<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZMEY — Personal Hub</title>
<meta name="theme-color" content="#080707">
<style>
*{box-sizing:border-box}body{margin:0;background:#080707;color:#eee5dc;font-family:Georgia,serif}button{font:inherit;cursor:pointer} .stage{position:relative;width:100%;aspect-ratio:1670/941;background:url('background.png') center/100% 100% no-repeat}.hotspot{position:absolute;left:2.7%;width:8%;height:12%;border:1px solid transparent;background:transparent;border-radius:9px;cursor:pointer}.hotspot:hover,.hotspot:focus-visible{border-color:#b99b8b;background:#ffffff12;outline:none}.games{top:13%}.videos{top:27.3%}.window{display:none;position:absolute;top:45%;left:31%;width:440px;max-width:85vw;background:#100e0f;border:1px solid #78535a;box-shadow:0 20px 65px #000e;z-index:5}.window.open{display:block}.bar{background:linear-gradient(90deg,#4b191d,#241214);border-bottom:1px solid #80565d;display:flex;align-items:center;justify-content:space-between;padding:12px 15px;cursor:move;user-select:none}.bar button{color:#eee5dc;border:0;background:transparent;font-size:24px;line-height:1}.links{padding:15px 24px}.links button{display:flex;align-items:center;justify-content:space-between;width:100%;padding:22px 7px;background:transparent;border:0;border-bottom:1px solid #44363a;color:#eee5dc;letter-spacing:3px;text-align:left}.links button:last-child{border-bottom:0}.links button:hover{color:#d4a5ac}.links small{font-family:Arial,sans-serif;color:#a79a9a;font-size:11px;letter-spacing:1px}.note{font:12px Arial,sans-serif;color:#b9a9aa;padding:0 24px 16px}.mobile-hint{display:none}@media(max-width:750px){.viewport{overflow-x:auto}.stage{width:950px;max-width:none}.window{position:fixed;top:25%;left:5%!important;width:90vw;max-width:none}.bar{cursor:default}.mobile-hint{display:block;text-align:center;padding:10px;font:12px Arial,sans-serif;color:#aaa}}
</style>
</head>
<body>
<div class="mobile-hint">Görseli sağa sola kaydırabilirsin.</div>
<div class="viewport"><main class="stage" aria-label="ZMEY kişisel sitesi">
<button class="hotspot games" aria-label="Games klasörünü aç" onclick="openWin('gamesWin')"></button>
<button class="hotspot videos" aria-label="Videos klasörünü aç" onclick="openWin('videosWin')"></button>
<section class="window" id="gamesWin" aria-label="Games bağlantıları" role="dialog">
<div class="bar"><span>♧ &nbsp; Games</span><button aria-label="Kapat" onclick="closeWin('gamesWin')">×</button></div>
<div class="links"><button onclick="comingSoon('Steam')">STEAM <small>PROFILE ↗</small></button><button onclick="comingSoon('Kick')">KICK <small>CHANNEL ↗</small></button></div><div class="note">Bağlantılar yakında eklenecek.</div>
</section>
<section class="window" id="videosWin" aria-label="Videos bağlantıları" role="dialog">
<div class="bar"><span>▷ &nbsp; Videos</span><button aria-label="Kapat" onclick="closeWin('videosWin')">×</button></div>
<div class="links"><button onclick="comingSoon('Instagram')">INSTAGRAM <small>PROFILE ↗</small></button><button onclick="comingSoon('YouTube')">YOUTUBE <small>CHANNEL ↗</small></button></div><div class="note">Bağlantılar yakında eklenecek.</div>
</section>
</main></div>
<script>
let z=10;
function openWin(id){const el=document.getElementById(id);el.classList.add('open');el.style.zIndex=++z}
function closeWin(id){document.getElementById(id).classList.remove('open')}
function comingSoon(name){alert(name+' bağlantısı henüz eklenmedi.')}
for(const win of document.querySelectorAll('.window')){
 const bar=win.querySelector('.bar');let drag=false,dx=0,dy=0;
 win.addEventListener('pointerdown',()=>win.style.zIndex=++z);
 bar.addEventListener('pointerdown',e=>{if(e.target.closest('button')||innerWidth<=750)return;drag=true;dx=e.clientX-win.offsetLeft;dy=e.clientY-win.offsetTop;bar.setPointerCapture(e.pointerId)});
 bar.addEventListener('pointermove',e=>{if(!drag)return;win.style.left=Math.max(0,Math.min(innerWidth-win.offsetWidth,e.clientX-dx))+'px';win.style.top=Math.max(0,Math.min(innerHeight-win.offsetHeight,e.clientY-dy))+'px'});
 bar.addEventListener('pointerup',()=>drag=false);bar.addEventListener('pointercancel',()=>drag=false);
}
</script>
</body></html>
