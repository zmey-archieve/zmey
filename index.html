
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080c0d">
<title>zmey.</title>

<style>
:root {
  --ink: #080c0d;
  --text: #e2ded9;
  --muted: #a9a3a0;
  --red: #963b45;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  background: var(--ink);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  overflow-x: hidden;
}

button { font: inherit; cursor: pointer; }

/* HAREKETLİ ORMAN */
#forestCanvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  display: block;
  pointer-events: none;
}

.forest-shade {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(
      ellipse at 50% 43%,
      #00000008 0%,
      #00000038 48%,
      #000000b5 100%
    ),
    linear-gradient(
      180deg,
      #03060755 0%,
      transparent 30%,
      #03060730 70%,
      #030607b0 100%
    );
}

/* SAYFA */
.page {
  position: relative;
  z-index: 1;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
}

header {
  display: flex;
  justify-content: flex-end;
  padding: 34px 6%;
}

.connected {
  display: flex;
  align-items: center;
  gap: 13px;
  color: #c7bfbb;
  font-size: 10px;
  letter-spacing: 4px;
}

.connected::before {
  content: "";
  width: 7px;
  height: 7px;
  background: var(--red);
  border-radius: 50%;
  box-shadow: 0 0 12px #963b4566;
  animation: pulse 3.5s infinite;
}

@keyframes pulse {
  50% { opacity: .35; }
}

main {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 45px 22px 90px;
}

.content {
  width: 100%;
  max-width: 950px;
  text-align: center;
  animation: reveal 1.8s ease both;
}

@keyframes reveal {
  from {
    opacity: 0;
    transform: translateY(14px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

h1 {
  margin: 0;
  font-size: clamp(76px, 10vw, 132px);
  font-weight: 400;
  font-style: normal;
  letter-spacing: -.085em;
  line-height: 1;
  text-shadow: 0 3px 28px #000a;
}

h1 span { color: #a73542; }

.quote {
  max-width: 760px;
  margin: 37px auto 0;
  color: #d7d0cb;
  font-size: clamp(12px, 1.4vw, 16px);
  font-weight: 400;
  font-style: normal;
  line-height: 2;
  letter-spacing: .12em;
  text-shadow: 0 2px 12px #000;
}

.author {
  display: block;
  margin-top: 18px;
  color: #c0b5b0;
  font-size: 10px;
  letter-spacing: 4px;
}

.divider {
  width: min(540px, 78%);
  height: 1px;
  margin: 54px auto 48px;
  background: linear-gradient(
    90deg,
    transparent,
    #71343c 25%,
    #71343c 75%,
    transparent
  );
}

/* KLASÖRLER */
.folders {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 24px;
  max-width: 760px;
  margin: auto;
}

.folder {
  min-height: 108px;
  padding: 24px 27px;
  display: flex;
  align-items: center;
  gap: 22px;
  background: #080b0bd9;
  border: 1px solid #80726d;
  color: var(--text);
  text-align: left;
  transition:
    transform .3s,
    background .3s,
    border-color .3s;
}

.folder:hover,
.folder:focus-visible {
  transform: translateY(-3px);
  background: #20171ae8;
  border-color: #c29a9e;
  outline: none;
}

.folder-icon {
  width: 36px;
  height: 36px;
  flex-shrink: 0;
  fill: none;
  stroke: #d6c9c0;
  stroke-width: 1.3;
}

.folder-info { flex: 1; }

.folder-name {
  display: block;
  font-size: 23px;
  letter-spacing: 3px;
}

.folder-sub {
  display: block;
  margin-top: 9px;
  color: #b5aaa4;
  font-size: 9px;
  letter-spacing: 2.5px;
}

.arrow {
  width: 23px;
  height: 23px;
  flex-shrink: 0;
  fill: none;
  stroke: #c2b3ac;
  stroke-width: 1.3;
  transition: transform .3s, stroke .3s;
}

.folder:hover .arrow {
  transform: translateX(6px);
  stroke: #cf8791;
}

/* ALT BAR */
footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 25px 6%;
  color: #c0b5ae;
  font-size: 10px;
  letter-spacing: 3px;
}

.sound {
  border: 0;
  background: transparent;
  color: inherit;
  font-size: 10px;
  letter-spacing: 2px;
  padding: 10px;
}

.sound:hover { color: white; }

/* PENCERELER */
.window {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 430px;
  max-width: 90vw;
  background: #0c0e10f5;
  border: 1px solid #79575e;
  box-shadow: 0 25px 100px #000e;
  z-index: 30;
}

.window.open { display: block; }

.window-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 17px 21px;
  background: #24171b;
  border-bottom: 1px solid #79575e;
  font-size: 11px;
  letter-spacing: 3px;
}

.window-head button {
  border: 0;
  background: transparent;
  color: #e8e0db;
  font-size: 24px;
  line-height: 1;
}

.window-links { padding: 17px 27px; }

.window-link {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  padding: 22px 5px;
  border: 0;
  border-bottom: 1px solid #393236;
  background: transparent;
  color: #e8e0db;
  font-size: 13px;
  letter-spacing: 3px;
  text-align: left;
}

.window-link:last-child { border: 0; }

.window-link:hover { color: #d1909a; }

.window-link svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.3;
  transition: transform .25s;
}

.window-link:hover svg {
  transform: translate(3px, -3px);
}

@media(max-width: 700px) {
  header { padding: 25px 7%; }
  main { padding: 40px 22px 70px; }
  h1 { font-size: clamp(72px, 16vw, 100px); }
  .quote { letter-spacing: .06em; }
  .author { letter-spacing: 3px; }
  .divider { margin: 40px auto 35px; }
  .folders {
    grid-template-columns: 1fr;
    max-width: 420px;
    gap: 15px;
  }
  .folder { min-height: 95px; padding: 20px 24px; }
  footer { padding: 22px 7%; font-size: 9px; letter-spacing: 1px; }
}

@media(prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<canvas id="forestCanvas" aria-hidden="true"></canvas>
<div class="forest-shade"></div>

<div class="page">
  <header>
    <div class="connected">CONNECTED</div>
  </header>

  <main>
    <section class="content">
      <h1>zmey<span>.</span></h1>

      <p class="quote">
        “The greatest secret to breaking the rules is to
        appear as though you are following them.”
        <span class="author">
          JOHAN LIEBERT / “MONSTER”
        </span>
      </p>

      <div class="divider"></div>

      <nav class="folders" aria-label="ZMEY bağlantıları">
        <button class="folder" onclick="openWindow('games')">
          <svg class="folder-icon" viewBox="0 0 48 48" aria-hidden="true">
            <path d="M4 13h16l6 6h18v23H4z"/>
            <path d="M4 19h40"/>
          </svg>
          <span class="folder-info">
            <span class="folder-name">games/</span>
            <span class="folder-sub">STEAM · KICK</span>
          </span>
          <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 12h15M13 6l6 6-6 6"/>
          </svg>
        </button>

        <button class="folder" onclick="openWindow('videos')">
          <svg class="folder-icon" viewBox="0 0 48 48" aria-hidden="true">
            <path d="M4 13h16l6 6h18v23H4z"/>
            <path d="M4 19h40"/>
          </svg>
          <span class="folder-info">
            <span class="folder-name">videos/</span>
            <span class="folder-sub">YOUTUBE · INSTAGRAM</span>
          </span>
          <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 12h15M13 6l6 6-6 6"/>
          </svg>
        </button>
      </nav>
    </section>
  </main>

  <footer>
    <span>NO SIGNAL / 00:00</span>
    <button class="sound" id="soundButton" onclick="toggleSound()">
      ◌ SOUND OFF
    </button>
  </footer>
</div>

<div class="window" id="games" role="dialog" aria-label="Games">
  <div class="window-head">
    <span>GAMES</span>
    <button onclick="closeWindow('games')" aria-label="Kapat">×</button>
  </div>
  <div class="window-links">
    <button class="window-link" onclick="comingSoon('Steam')">
      STEAM
      <svg viewBox="0 0 24 24"><path d="M5 19 19 5M8 5h11v11"/></svg>
    </button>
    <button class="window-link" onclick="comingSoon('Kick')">
      KICK
      <svg viewBox="0 0 24 24"><path d="M5 19 19 5M8 5h11v11"/></svg>
    </button>
  </div>
</div>

<div class="window" id="videos" role="dialog" aria-label="Videos">
  <div class="window-head">
    <span>VIDEOS</span>
    <button onclick="closeWindow('videos')" aria-label="Kapat">×</button>
  </div>
  <div class="window-links">
    <button class="window-link" onclick="comingSoon('YouTube')">
      YOUTUBE
      <svg viewBox="0 0 24 24"><path d="M5 19 19 5M8 5h11v11"/></svg>
    </button>
    <button class="window-link" onclick="comingSoon('Instagram')">
      INSTAGRAM
      <svg viewBox="0 0 24 24"><path d="M5 19 19 5M8 5h11v11"/></svg>
    </button>
  </div>
</div>

<script>
/* SİNEMATİK ORMAN MOTORU */
const canvas = document.getElementById("forestCanvas");
const ctx = canvas.getContext("2d", { alpha: false });

let W = 0;
let H = 0;
let dpr = 1;
let lastTime = 0;
let elapsed = 0;
let trees = [];

const reduceMotion = window.matchMedia(
  "(prefers-reduced-motion: reduce)"
).matches;

function rnd(n) {
  const v = Math.sin(n * 127.1 + 42.7) * 43758.5453;
  return v - Math.floor(v);
}

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  trees = [];

  for (let i = 0; i < 85; i++) {
    const depth = .12 + rnd(i + 10) * .88;

    trees.push({
      x: rnd(i + 200) * 1.6 - .3,
      depth,
      height: .7 + rnd(i + 400) * 1.1,
      lean: (rnd(i + 500) - .5) * .13,
      seed: rnd(i + 700) * 100,
      branches: 5 + Math.floor(rnd(i + 900) * 6)
    });
  }

  trees.sort((a, b) => a.depth - b.depth);
}

window.addEventListener("resize", resize);
resize();

function drawTree(tree, t) {
  const depth = tree.depth;

  /* Yavaş ileri hareket / parallax */
  const travel = reduceMotion ? 0 :
    (Math.sin(t * .00012) * .025);

  const perspective = depth + travel * depth;

  const scale = .25 + perspective * 1.9;
  const x = (tree.x - .5) * W * scale + W / 2;
  const baseY = H * (.73 + perspective * .37);
  const height = H * tree.height * scale;
  const trunkWidth = Math.max(1.5, 3 + perspective * 15);

  const sway = reduceMotion ? 0 :
    Math.sin(t * .00035 + tree.seed) * (2 + depth * 4);

  const darkness = Math.floor(18 - depth * 15);
  const alpha = .22 + depth * .76;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, baseY);

  ctx.strokeStyle =
    `rgb(${darkness},${darkness + 4},${darkness + 5})`;
  ctx.lineCap = "round";

  /* Gövde */
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.bezierCurveTo(
    sway * .2, -height * .35,
    sway + tree.lean * height, -height * .75,
    sway + tree.lean * height * 1.4, -height
  );
  ctx.lineWidth = trunkWidth;
  ctx.stroke();

  /* Dallar */
  for (let b = 0; b < tree.branches; b++) {
    const p = .25 + b / tree.branches * .68;
    const side = b % 2 === 0 ? -1 : 1;

    const startX = sway * p + tree.lean * height * p;
    const startY = -height * p;

    const length = height * (.14 + rnd(b + tree.seed) * .18);
    const angle = side * (.5 + rnd(b + tree.seed + 50) * .5);

    const endX = startX + Math.sin(angle) * length;
    const endY = startY - Math.cos(angle) * length;

    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.quadraticCurveTo(
      startX + (endX - startX) * .7,
      startY - length * .1,
      endX + sway * .3,
      endY
    );
    ctx.lineWidth = Math.max(1, trunkWidth * (.35 - p * .2));
    ctx.stroke();

    /* Küçük yan dallar */
    ctx.beginPath();
    ctx.moveTo(
      startX + (endX - startX) * .65,
      startY + (endY - startY) * .65
    );
    ctx.lineTo(
      endX + side * length * .16,
      endY - length * .28
    );
    ctx.lineWidth = Math.max(.6, trunkWidth * .11);
    ctx.stroke();
  }

  ctx.restore();
}

function drawFog(t, layer) {
  const drift = reduceMotion ? 0 :
    Math.sin(t * .0001 + layer * 2) * W * .12;

  const y = H * (.36 + layer * .16);
  const x = W * .5 + drift;

  const fog = ctx.createRadialGradient(
    x, y, 0,
    x, y, W * .7
  );

  const opacity = layer === 0 ? .085 : .12;

  fog.addColorStop(0, `rgba(157,177,177,${opacity})`);
  fog.addColorStop(.45, `rgba(112,139,140,${opacity * .45})`);
  fog.addColorStop(1, "rgba(112,139,140,0)");

  ctx.fillStyle = fog;
  ctx.fillRect(0, 0, W, H);
}

function drawBackground(t) {
  const glow = reduceMotion ? 0 :
    Math.sin(t * .0002) * .035;

  const bg = ctx.createRadialGradient(
    W * .5, H * .4, 0,
    W * .5, H * .4, Math.max(W, H) * .85
  );

  bg.addColorStop(0, `rgb(
    ${Math.floor(31 + glow * 30)},
    ${Math.floor(41 + glow * 30)},
    ${Math.floor(43 + glow * 30)}
  )`);
  bg.addColorStop(.55, "#10191b");
  bg.addColorStop(1, "#030607");

  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  /* Uzak ışık */
  const light = ctx.createRadialGradient(
    W * .52, H * .37, 0,
    W * .52, H * .37, W * .5
  );

  light.addColorStop(0, "rgba(130,150,148,.10)");
  light.addColorStop(1, "rgba(130,150,148,0)");

  ctx.fillStyle = light;
  ctx.fillRect(0, 0, W, H);
}

function drawGround() {
  const ground = ctx.createLinearGradient(
    0, H * .7, 0, H
  );
  ground.addColorStop(0, "rgba(3,6,7,0)");
  ground.addColorStop(1, "rgba(2,4,5,.85)");

  ctx.fillStyle = ground;
  ctx.fillRect(0, H * .7, W, H * .3);
}

function render(time) {
  const delta = lastTime ? Math.min(time - lastTime, 50) : 16;
  lastTime = time;
  elapsed += delta;

  drawBackground(elapsed);

  /* Uzak ağaçlar */
  trees.filter(tree => tree.depth < .48)
    .forEach(tree => drawTree(tree, elapsed));

  drawFog(elapsed, 0);

  /* Orta katman */
  trees.filter(tree => tree.depth >= .48 && tree.depth < .78)
    .forEach(tree => drawTree(tree, elapsed));

  drawFog(elapsed, 1);

  /* Yakın ağaçlar */
  trees.filter(tree => tree.depth >= .78)
    .forEach(tree => drawTree(tree, elapsed));

  drawGround();

  if (!reduceMotion) {
    requestAnimationFrame(render);
  }
}

requestAnimationFrame(render);

/* PENCERELER */
function openWindow(id) {
  document.querySelectorAll(".window").forEach(w => {
    w.classList.remove("open");
  });
  document.getElementById(id).classList.add("open");
}

function closeWindow(id) {
  document.getElementById(id).classList.remove("open");
}

function comingSoon(name) {
  alert(name + " bağlantısı yakında eklenecek.");
}

/* ORİJİNAL AMBIENT SES */
let audioContext = null;
let soundNodes = [];
let soundOn = false;

function toggleSound() {
  const button = document.getElementById("soundButton");

  if (soundOn) {
    soundNodes.forEach(node => {
      try { node.stop(); } catch (e) {}
    });
    soundNodes = [];
    soundOn = false;
    button.textContent = "◌ SOUND OFF";
    return;
  }

  try {
    const AudioCtx =
      window.AudioContext || window.webkitAudioContext;

    if (!AudioCtx) {
      alert("Tarayıcınız ses özelliğini desteklemiyor.");
      return;
    }

    if (!audioContext) {
      audioContext = new AudioCtx();
    }

    audioContext.resume();

    const master = audioContext.createGain();
    master.gain.value = .025;
    master.connect(audioContext.destination);

    [55, 82.41, 110].forEach((frequency, i) => {
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();

      oscillator.type = "sine";
      oscillator.frequency.value = frequency;
      gain.gain.value = i === 0 ? .35 : .12;

      oscillator.connect(gain);
      gain.connect(master);
      oscillator.start();

      soundNodes.push(oscillator);
    });

    soundOn = true;
    button.textContent = "◉ SOUND ON";

  } catch (error) {
    console.error("Ses başlatılamadı:", error);
  }
}
</script>

</body>
</html>
