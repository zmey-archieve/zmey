
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090d11">
<title>zmey.</title>
<style>
:root {
  --text:#e9edf0;
  --muted:#9cabb5;
  --red:#a04753;
}
* { box-sizing:border-box; }
html,body { margin:0; min-height:100%; }
body {
  background:#090d11;
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}
button { font:inherit; cursor:pointer; }

/* ENDÜSTRİYEL STÜDYO */
.environment {
  position:fixed;
  inset:0;
  z-index:-1;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 85%,#283e4c66,transparent 48%),
    radial-gradient(ellipse at 18% 27%,#41586c45,transparent 42%),
    radial-gradient(ellipse at 88% 20%,#344a6140,transparent 43%),
    linear-gradient(135deg,#101920,#090d11 58%,#10171d);
}
.environment::before {
  content:"";
  position:absolute;
  inset:-50%;
  background:conic-gradient(
    from 20deg at 50% 50%,
    transparent 0deg,
    #94c9f00d 45deg,
    transparent 100deg,
    #d8e7f00b 170deg,
    transparent 240deg,
    #688bad12 300deg,
    transparent 360deg
  );
  animation:ambientRotate 45s linear infinite;
}
.environment::after {
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(
    ellipse at center,
    transparent 20%,
    #020405a8 100%
  );
}
.studio-line {
  position:absolute;
  width:130%;
  height:1px;
  left:-15%;
  top:76%;
  background:linear-gradient(
    90deg,transparent,#93b6cc40,transparent
  );
  box-shadow:0 0 50px 18px #7ea8c00b;
}
.studio-glow {
  position:absolute;
  left:50%;
  top:70%;
  width:75vw;
  height:30vh;
  transform:translateX(-50%);
  background:radial-gradient(
    ellipse,#91b8ce16,transparent 70%
  );
  filter:blur(35px);
  animation:breathe 10s ease-in-out infinite alternate;
}
@keyframes ambientRotate {
  to { transform:rotate(360deg); }
}
@keyframes breathe {
  to { opacity:.35; transform:translateX(-50%) scale(1.2); }
}

/* ANA YAPI */
.page {
  min-height:100svh;
  display:flex;
  flex-direction:column;
}
main {
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:65px 20px;
}
.content {
  width:100%;
  max-width:850px;
  text-align:center;
  animation:enter 1s ease both;
}
@keyframes enter {
  from { opacity:0; transform:translateY(14px); }
  to { opacity:1; transform:translateY(0); }
}
h1 {
  margin:0;
  font-size:clamp(75px,11vw,125px);
  font-weight:400;
  letter-spacing:-.085em;
  line-height:1;
  text-shadow:0 5px 30px #0009;
}
h1 span { color:var(--red); }
.quote {
  max-width:720px;
  margin:35px auto 0;
  color:#d5dce0;
  font-size:clamp(12px,1.5vw,15px);
  font-style:normal;
  letter-spacing:.1em;
  line-height:2;
}
.author {
  display:block;
  margin-top:17px;
  color:#aebbc4;
  font-size:10px;
  letter-spacing:4px;
}

/* ARŞİV ÇERÇEVESİ */
.archive {
  width:100%;
  max-width:700px;
  margin:55px auto 0;
  padding:22px;
  text-align:left;
  background:linear-gradient(
    145deg,#151c22e8,#080c10ed
  );
  border:1px solid #566875;
  box-shadow:
    inset 0 1px #b3d6e21c,
    0 30px 90px #0008,
    0 0 60px #638ba00c;
  backdrop-filter:blur(16px);
}
.archive-head,
.archive-path,
.archive-foot {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}
.archive-head {
  padding-bottom:17px;
  border-bottom:1px solid #485862;
}
.archive-brand {
  color:#d1dce2;
  font-size:10px;
  letter-spacing:2px;
}
.archive-code,
.archive-path,
.archive-foot {
  color:#95a6b1;
  font-size:9px;
  letter-spacing:1.5px;
}
.archive-path { padding:22px 0; }
.access { color:#b9d3e2; }
.archive-grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:15px;
}

/* GERÇEKÇİ KROM KART */
.file {
  --mx:50%;
  --my:50%;
  --rx:0deg;
  --ry:0deg;
  position:relative;
  isolation:isolate;
  overflow:hidden;
  min-height:205px;
  padding:21px;
  display:flex;
  flex-direction:column;
  text-align:left;
  color:#142633;
  border:1px solid #b9cdd9;
  border-radius:3px;
  background:
    linear-gradient(
      113deg,
      #e2eaf0 0%,
      #a1b5c4 7%,
      #526a7d 18%,
      #a9c0d0 29%,
      #e2edf3 33%,
      #7e99ac 43%,
      #394f61 52%,
      #7794a9 63%,
      #c9dce8 76%,
      #637e91 88%,
      #d7e5ed 100%
    );
  box-shadow:
    inset 0 1px 1px #fff9,
    inset 0 -2px 3px #1e344c77,
    inset 2px 0 2px #ffffff55,
    0 12px 30px #0007;
  transform:perspective(900px)
    rotateX(var(--rx))
    rotateY(var(--ry));
  transition:
    transform .18s ease-out,
    box-shadow .3s,
    border-color .3s;
  will-change:transform;
}

/* Fırçalanmış metal mikro dokusu */
.file::before {
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:
    repeating-linear-gradient(
      0deg,
      #ffffff15 0px,
      #ffffff15 1px,
      #00000008 1px,
      transparent 3px
    ),
    linear-gradient(
      180deg,
      #ffffff60 0%,
      transparent 15%,
      transparent 80%,
      #101d2d45 100%
    );
  mix-blend-mode:soft-light;
}

/* Fareyi takip eden speküler ışık */
.file::after {
  content:"";
  position:absolute;
  inset:-2px;
  z-index:-1;
  pointer-events:none;
  background:
    radial-gradient(
      circle 155px at var(--mx) var(--my),
      #ffffffb8 0%,
      #c7ecff70 18%,
      #a5d8fa22 45%,
      transparent 75%
    ),
    linear-gradient(
      115deg,
      transparent 15%,
      #ffffff14 35%,
      #ffffff80 43%,
      #ffffff18 47%,
      transparent 58%
    );
  background-blend-mode:screen;
  opacity:.65;
  transition:opacity .3s;
}
.file:hover::after { opacity:1; }
.file:hover,
.file:focus-visible {
  border-color:#f0faff;
  box-shadow:
    inset 0 1px 2px #fff,
    inset 0 -2px 3px #1e344c77,
    0 20px 45px #0009,
    0 0 32px #a6d5ef30;
  outline:none;
}
.file-top,.file-bottom {
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.file-id {
  color:#1a3244;
  font-size:9px;
  font-weight:700;
  letter-spacing:2px;
}
.file-icon {
  width:30px;
  height:30px;
  fill:none;
  stroke:#1a3041;
  stroke-width:1.4;
}
.file-middle {
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:18px 0;
}
.file-name {
  color:#0e202e;
  font-size:24px;
  font-weight:600;
  letter-spacing:3px;
}
.file-sub {
  margin-top:9px;
  color:#253c4e;
  font-size:9px;
  font-weight:600;
  letter-spacing:2px;
}
.file-bottom {
  color:#253b4a;
  font-size:9px;
  font-weight:600;
  letter-spacing:1.5px;
}
.file-arrow {
  width:20px;
  height:20px;
  fill:none;
  stroke:#172e40;
  stroke-width:1.5;
  transition:transform .25s;
}
.file:hover .file-arrow {
  transform:translate(3px,-3px);
}
.archive-foot { margin-top:21px; }
.cursor {
  display:inline-block;
  width:6px;
  height:10px;
  margin-left:5px;
  background:#a6d2e7;
  animation:blink 1.1s steps(1) infinite;
}
@keyframes blink { 50% { opacity:0; } }

/* AÇILAN TERMİNAL */
.overlay {
  position:fixed;
  inset:0;
  z-index:10;
  display:none;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:#020406d6;
  backdrop-filter:blur(12px);
}
.overlay.open { display:flex; }
.terminal {
  width:100%;
  max-width:470px;
  background:#0d141a;
  border:1px solid #8eaabb;
  box-shadow:0 30px 100px #000c;
}
.terminal-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:17px 21px;
  background:linear-gradient(110deg,#344d60,#162630);
  border-bottom:1px solid #8eaabb;
}
.terminal-title {
  color:#e3edf3;
  font-size:10px;
  letter-spacing:2px;
}
.close {
  border:0;
  background:transparent;
  color:white;
  font-size:24px;
}
.terminal-body { padding:26px; }
.terminal-status {
  margin:0 0 25px;
  color:#aac6d6;
  font-size:10px;
  line-height:2;
  letter-spacing:1.5px;
  white-space:pre-line;
}
.terminal-link {
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 4px;
  border:0;
  border-bottom:1px solid #3d505e;
  background:transparent;
  color:#e2edf3;
  font-size:12px;
  letter-spacing:3px;
  text-align:left;
  animation:linkIn .4s ease both;
}
.terminal-link:nth-child(2) {
  animation-delay:.15s;
}
.terminal-link:hover { color:#a9d9f5; }
.terminal-link svg {
  width:19px;
  height:19px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.4;
}
@keyframes linkIn {
  from { opacity:0; transform:translateY(8px); }
  to { opacity:1; transform:translateY(0); }
}
.terminal-foot {
  margin-top:25px;
  color:#879ba8;
  font-size:9px;
  letter-spacing:2px;
}
footer {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:25px 6%;
  color:#9cabb5;
  font-size:10px;
  letter-spacing:2px;
}
.sound {
  border:0;
  background:transparent;
  color:inherit;
  font-size:10px;
  letter-spacing:2px;
  padding:8px;
}
.sound:hover { color:white; }

@media(max-width:600px) {
  main { padding:45px 16px 60px; }
  .quote { letter-spacing:.04em; }
  .author { letter-spacing:2px; }
  .archive { padding:15px; margin-top:40px; }
  .archive-brand,.archive-code,.archive-path {
    font-size:8px;
  }
  .archive-grid { gap:9px; }
  .file { min-height:175px; padding:13px; }
  .file-name { font-size:19px; }
  .file-sub { font-size:8px; letter-spacing:1px; }
  .file-id { font-size:8px; }
  .file-icon { width:25px; height:25px; }
  footer { padding:20px 7%; font-size:9px; }
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation-duration:.01ms !important;
    transition-duration:.01ms !important;
  }
}
</style>
</head>
<body>

<div class="environment" aria-hidden="true">
  <div class="studio-line"></div>
  <div class="studio-glow"></div>
</div>

<div class="page">
  <main>
    <section class="content">
      <h1>zmey<span>.</span></h1>

      <p class="quote">
        “The greatest secret to breaking the rules is to
        appear as though you are following them.”
        <span class="author">
          JOHAN LIEBERT / “MONSTER”
        </span>
      </p>

      <div class="archive">
        <div class="archive-head">
          <span class="archive-brand">
            ZMEY / CHROME ARCHIVE
          </span>
          <span class="archive-code">REV.005</span>
        </div>

        <div class="archive-path">
          <span>C:\ZMEY\ARCHIVE</span>
          <span class="access">ACCESS GRANTED</span>
        </div>

        <div class="archive-grid">
          <button class="file" onclick="openTerminal('games')">
            <div class="file-top">
              <span class="file-id">UNIT_001</span>
              <svg class="file-icon" viewBox="0 0 32 32"
                   aria-hidden="true">
                <path d="M9 12h14c3 0 5 3 6 9 1 4-2 6-5 3l-4-4h-8l-4 4c-3 3-6 1-5-3 1-6 3-9 6-9z"/>
                <path d="M10 15v7M6.5 18.5h7"/>
                <circle cx="22" cy="16" r="1"/>
                <circle cx="25" cy="19" r="1"/>
              </svg>
            </div>
            <div class="file-middle">
              <span class="file-name">GAMES</span>
              <span class="file-sub">STEAM / KICK</span>
            </div>
            <div class="file-bottom">
              <span>ACCESS</span>
              <svg class="file-arrow" viewBox="0 0 24 24">
                <path d="M5 19 19 5M8 5h11v11"/>
              </svg>
            </div>
          </button>

          <button class="file" onclick="openTerminal('videos')">
            <div class="file-top">
              <span class="file-id">UNIT_002</span>
              <svg class="file-icon" viewBox="0 0 32 32"
                   aria-hidden="true">
                <rect x="4" y="9" width="24" height="16" rx="2"/>
                <path d="M4 14h24M10 9l4 5M19 9l4 5"/>
                <path d="m14 17 6 3-6 3z"/>
              </svg>
            </div>
            <div class="file-middle">
              <span class="file-name">VIDEOS</span>
              <span class="file-sub">YOUTUBE / INSTAGRAM</span>
            </div>
            <div class="file-bottom">
              <span>ACCESS</span>
              <svg class="file-arrow" viewBox="0 0 24 24">
                <path d="M5 19 19 5M8 5h11v11"/>
              </svg>
            </div>
          </button>
        </div>

        <div class="archive-foot">
          <span>SYSTEM READY <span class="cursor"></span></span>
          <span>02 UNITS</span>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <span>NO SIGNAL / 00:00</span>
    <button class="sound" id="soundButton"
            onclick="toggleSound()">◌ SOUND OFF</button>
  </footer>
</div>

<div class="overlay" id="overlay" onclick="closeTerminal(event)">
  <div class="terminal" role="dialog" aria-modal="true"
       aria-label="Archive terminal">
    <div class="terminal-head">
      <span class="terminal-title" id="terminalTitle"></span>
      <button class="close" onclick="closeTerminal()"
              aria-label="Kapat">×</button>
    </div>
    <div class="terminal-body">
      <p class="terminal-status" id="terminalStatus"></p>
      <div id="terminalLinks"></div>
      <div class="terminal-foot">
        END OF DIRECTORY <span class="cursor"></span>
      </div>
    </div>
  </div>
</div>

<script>
/* FAREYİ TAKİP EDEN KROM YANSIMALARI */
const reduceMotion = window.matchMedia(
  "(prefers-reduced-motion: reduce)"
).matches;

document.querySelectorAll(".file").forEach(card => {
  if (reduceMotion) return;

  card.addEventListener("pointermove", e => {
    if (e.pointerType === "touch") return;

    const rect = card.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    const y = (e.clientY - rect.top) / rect.height;

    card.style.setProperty("--mx", (x * 100) + "%");
    card.style.setProperty("--my", (y * 100) + "%");
    card.style.setProperty("--rx", ((.5 - y) * 5) + "deg");
    card.style.setProperty("--ry", ((x - .5) * 7) + "deg");
  });

  card.addEventListener("pointerleave", () => {
    card.style.setProperty("--mx", "50%");
    card.style.setProperty("--my", "50%");
    card.style.setProperty("--rx", "0deg");
    card.style.setProperty("--ry", "0deg");
  });
});

/* ARŞİV PENCERELERİ */
const directories = {
  games: {
    title:"UNIT_001 / GAMES",
    path:"C:\\ZMEY\\ARCHIVE\\GAMES",
    links:["STEAM","KICK"]
  },
  videos: {
    title:"UNIT_002 / VIDEOS",
    path:"C:\\ZMEY\\ARCHIVE\\VIDEOS",
    links:["YOUTUBE","INSTAGRAM"]
  }
};

const arrow = `
<svg viewBox="0 0 24 24" aria-hidden="true">
  <path d="M5 19 19 5M8 5h11v11"/>
</svg>`;

let previousFocus = null;

function openTerminal(type) {
  const data = directories[type];
  previousFocus = document.activeElement;

  document.getElementById("terminalTitle").textContent =
    data.title;

  document.getElementById("terminalStatus").textContent =
    "> " + data.path + "\n> DIRECTORY OPENED";

  document.getElementById("terminalLinks").innerHTML =
    data.links.map(name => `
      <button class="terminal-link"
        onclick="comingSoon('${name}')">
        <span>${name}</span>${arrow}
      </button>
    `).join("");

  document.getElementById("overlay").classList.add("open");
  document.querySelector(".close").focus();
}

function closeTerminal(event) {
  if (event && event.target !== event.currentTarget) return;
  const overlay = document.getElementById("overlay");
  if (!overlay.classList.contains("open")) return;
  overlay.classList.remove("open");
  if (previousFocus) previousFocus.focus();
}

document.addEventListener("keydown", e => {
  const overlay = document.getElementById("overlay");
  if (!overlay.classList.contains("open")) return;

  if (e.key === "Escape") closeTerminal();

  if (e.key === "Tab") {
    const controls = [...overlay.querySelectorAll("button")];
    const first = controls[0];
    const last = controls[controls.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  }
});

function comingSoon(name) {
  alert(name + " bağlantısı yakında eklenecek.");
}

/* HAFİF AMBIENT SES */
let audioContext = null;
let soundNodes = [];
let soundGain = null;
let soundOn = false;

async function toggleSound() {
  const button = document.getElementById("soundButton");

  if (soundOn) {
    soundNodes.forEach(node => {
      try { node.stop(); } catch(e) {}
      node.disconnect();
    });
    soundNodes = [];
    if (soundGain) soundGain.disconnect();
    soundGain = null;
    soundOn = false;
    button.textContent = "◌ SOUND OFF";
    return;
  }

  try {
    const AudioCtx =
      window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;

    if (!audioContext) audioContext = new AudioCtx();
    await audioContext.resume();

    soundGain = audioContext.createGain();
    soundGain.gain.value = .025;
    soundGain.connect(audioContext.destination);

    [55,82.41,110].forEach((freq,i) => {
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.value = i === 0 ? .35 : .12;
      osc.connect(gain);
      gain.connect(soundGain);
      osc.start();
      soundNodes.push(osc);
    });

    soundOn = true;
    button.textContent = "◉ SOUND ON";
  } catch(e) {
    console.error("Ses başlatılamadı:",e);
  }
}
</script>
</body>
</html>
