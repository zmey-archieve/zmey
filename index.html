
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZMEY — Personal Hub</title>
<style>
:root {
  --bg:#080809;
  --panel:#151416;
  --line:#514045;
  --text:#eee9e4;
  --muted:#a49b9d;
  --red:#9d525d;
}
* { box-sizing:border-box; }
body {
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}
button { font:inherit; cursor:pointer; }
.topbar {
  height:70px;
  padding:0 5%;
  border-bottom:1px solid #30292c;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:11px;
  letter-spacing:3px;
}
.topbar span { color:var(--muted); }
.layout {
  max-width:1450px;
  margin:auto;
  padding:65px 5% 130px;
  display:grid;
  grid-template-columns:130px 1fr;
  gap:7%;
}
.sidebar {
  display:flex;
  flex-direction:column;
  gap:35px;
}
.folder {
  border:0;
  background:none;
  color:var(--text);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
  letter-spacing:2px;
  font-size:11px;
}
.folder svg {
  width:60px;
  height:60px;
  stroke:#d5c6bd;
  fill:#282326;
  stroke-width:1.3;
  transition:transform .2s;
}
.folder:hover svg { transform:translateY(-5px); }
.hero { padding-top:30px; }
.eyebrow {
  font-size:11px;
  letter-spacing:4px;
  color:var(--red);
}
h1 {
  font-family:Georgia,serif;
  font-weight:400;
  font-size:clamp(85px,14vw,210px);
  letter-spacing:-9px;
  line-height:1;
  margin:20px 0 10px;
}
.subtitle {
  color:var(--muted);
  letter-spacing:2px;
  font-size:12px;
}
.description {
  color:#c5bbba;
  margin-top:28px;
  line-height:1.8;
}
.actions {
  display:flex;
  gap:12px;
  margin-top:40px;
}
.actions button {
  background:#191619;
  color:var(--text);
  border:1px solid var(--line);
  padding:15px 28px;
  letter-spacing:2px;
  font-size:12px;
  transition:background .2s;
}
.actions button:hover { background:#39262c; }
.window {
  position:fixed;
  top:24%;
  left:35%;
  width:min(410px,90vw);
  background:var(--panel);
  border:1px solid #6a5056;
  box-shadow:0 25px 90px #000c;
  z-index:10;
  display:none;
}
.window.active { display:block; }
.windowbar {
  background:#241c20;
  padding:15px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
  cursor:move;
  user-select:none;
  font-size:12px;
  letter-spacing:3px;
}
.close {
  background:transparent;
  border:0;
  color:var(--text);
  font-size:22px;
  line-height:1;
}
.windowbody { padding:24px; }
.windowbody p {
  color:var(--muted);
  font-size:12px;
  margin:0 0 20px;
}
.item {
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:20px 5px;
  border:0;
  border-bottom:1px solid #40373a;
  background:transparent;
  color:var(--text);
  text-align:left;
  letter-spacing:2px;
  font-size:14px;
}
.item small {
  color:var(--muted);
  font-size:10px;
  letter-spacing:0;
}
.item:hover { color:#c58d96; }
.desk {
  position:relative;
  margin:55px 0 0;
  height:185px;
  border-bottom:2px solid #55494a;
  display:flex;
  justify-content:flex-end;
  align-items:flex-end;
  gap:25px;
  opacity:.85;
}
.monitor {
  width:210px;
  height:125px;
  border:8px solid #e2ded8;
  border-radius:8px;
  background:linear-gradient(135deg,#17171c,#34242b);
  box-shadow:0 0 30px #ffffff12;
  position:relative;
  margin-bottom:20px;
}
.monitor:after {
  content:"";
  position:absolute;
  width:8px;
  height:25px;
  background:#d9d5d0;
  bottom:-32px;
  left:50%;
}
.pc {
  width:78px;
  height:150px;
  border:4px solid #e5e0dc;
  border-radius:7px;
  background:linear-gradient(125deg,#242229,#111114);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:7px;
}
.fan {
  width:38px;
  height:38px;
  border:3px solid #a4a1a9;
  border-radius:50%;
  box-shadow:0 0 12px #aaa3bc70;
}
.cup {
  width:53px;
  height:48px;
  background:#050505;
  border:1px solid #555;
  border-radius:8px 8px 18px 18px;
  margin-bottom:2px;
  position:relative;
}
.cup:after {
  content:"";
  position:absolute;
  right:-17px;
  top:8px;
  width:17px;
  height:23px;
  border:5px solid #151515;
  border-radius:50%;
}
footer {
  position:fixed;
  bottom:0;
  width:100%;
  background:#100e10eF;
  border-top:1px solid #352b2f;
  padding:18px 5%;
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:10px;
  letter-spacing:2px;
}
@media(max-width:700px) {
  .layout {
    grid-template-columns:1fr;
    padding:30px 6% 100px;
    gap:25px;
  }
  .sidebar { flex-direction:row; gap:25px; }
  .folder svg { width:45px; height:45px; }
  .hero { padding-top:10px; }
  h1 { letter-spacing:-5px; }
  .window {
    left:5%!important;
    top:18%!important;
    width:90%;
  }
  .windowbar { cursor:default; }
  .desk { height:160px; gap:18px; }
  .monitor { width:145px; height:95px; }
  .pc { height:120px; width:60px; }
  .cup { width:38px; height:38px; }
}
</style>
</head>
<body>

<header class="topbar">
  <strong>ZMEY / 001</strong>
  <span>PERSONAL HUB — ONLINE</span>
</header>

<div class="layout">
  <aside class="sidebar">
    <button class="folder" onclick="openWindow('games')">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path d="M5 16h22l7 8h25v30H5z"/>
      </svg>
      GAMES
    </button>
    <button class="folder" onclick="openWindow('videos')">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path d="M5 16h22l7 8h25v30H5z"/>
      </svg>
      VIDEOS
    </button>
  </aside>

  <main class="hero">
    <div class="eyebrow">プレイヤー / PLAYER PROFILE</div>
    <h1>ZMEY.</h1>
    <div class="subtitle">GAMES / VIDEOS</div>
    <p class="description">
      Gaming, creating & everything in between.<br>
      One place. All my worlds.
    </p>

    <div class="actions">
      <button onclick="openWindow('games')">GAMES ↗</button>
      <button onclick="openWindow('videos')">VIDEOS ↗</button>
    </div>

    <div class="desk" aria-label="Minimal white gaming setup">
      <div class="cup"></div>
      <div class="monitor"></div>
      <div class="pc">
        <div class="fan"></div>
        <div class="fan"></div>
      </div>
    </div>
  </main>
</div>

<section id="games" class="window" role="dialog"
  aria-label="Games window">
  <div class="windowbar">
    <span>▣ GAMES</span>
    <button class="close" onclick="closeWindow('games')"
      aria-label="Close Games">×</button>
  </div>
  <div class="windowbody">
    <p>GAMING / SOCIAL LINKS</p>
    <button class="item" onclick="pending('Steam')">
      STEAM <small>PROFILE ↗</small>
    </button>
    <button class="item" onclick="pending('Kick')">
      KICK <small>CHANNEL ↗</small>
    </button>
  </div>
</section>

<section id="videos" class="window" role="dialog"
  aria-label="Videos window">
  <div class="windowbar">
    <span>▣ VIDEOS</span>
    <button class="close" onclick="closeWindow('videos')"
      aria-label="Close Videos">×</button>
  </div>
  <div class="windowbody">
    <p>CONTENT / SOCIAL LINKS</p>
    <button class="item" onclick="pending('Instagram')">
      INSTAGRAM <small>PROFILE ↗</small>
    </button>
    <button class="item" onclick="pending('YouTube')">
      YOUTUBE <small>CHANNEL ↗</small>
    </button>
  </div>
</section>

<footer>
  <span>© 2026 ZMEY</span>
  <span>PERSONAL SPACE / ONLINE</span>
</footer>

<script>
let topLayer = 20;

function openWindow(id) {
  const win = document.getElementById(id);
  win.classList.add('active');
  win.style.zIndex = ++topLayer;
}
function closeWindow(id) {
  document.getElementById(id).classList.remove('active');
}
function pending(name) {
  alert(name + ' bağlantısı yakında eklenecek.');
}

document.querySelectorAll('.window').forEach(win => {
  const bar = win.querySelector('.windowbar');
  let dragging = false;
  let offsetX = 0;
  let offsetY = 0;

  win.addEventListener('pointerdown', () => {
    win.style.zIndex = ++topLayer;
  });

  bar.addEventListener('pointerdown', e => {
    if (e.target.closest('button') || innerWidth <= 700) return;
    dragging = true;
    offsetX = e.clientX - win.offsetLeft;
    offsetY = e.clientY - win.offsetTop;
    bar.setPointerCapture(e.pointerId);
  });

  bar.addEventListener('pointermove', e => {
    if (!dragging) return;
    const x = Math.max(0, Math.min(
      innerWidth - win.offsetWidth, e.clientX - offsetX
    ));
    const y = Math.max(0, Math.min(
      innerHeight - win.offsetHeight, e.clientY - offsetY
    ));
    win.style.left = x + 'px';
    win.style.top = y + 'px';
  });

  bar.addEventListener('pointerup', () => {
    dragging = false;
  });
  bar.addEventListener('pointercancel', () => {
    dragging = false;
  });
});
</script>
</body>
</html>
