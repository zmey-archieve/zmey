
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zmey.</title>

<style>
:root {
  --bg: #0b0d0e;
  --panel: #111315;
  --card: #191a1c;
  --text: #e9e4df;
  --muted: #a69d99;
  --line: #504649;
  --red: #963b45;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  background:
    radial-gradient(ellipse at 50% 40%, #242a2b 0%, #111617 42%, #080a0b 100%);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}

button {
  font: inherit;
  cursor: pointer;
}

.page {
  min-height: 100svh;
  display: flex;
  flex-direction: column;
}

header {
  display: flex;
  justify-content: flex-end;
  padding: 32px 6%;
}

.connected {
  display: flex;
  align-items: center;
  gap: 12px;
  color: #c5bab5;
  font-size: 10px;
  letter-spacing: 3px;
}

.connected::before {
  content: "";
  width: 7px;
  height: 7px;
  background: var(--red);
  border-radius: 50%;
  box-shadow: 0 0 12px #963b4580;
}

main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 50px 20px 75px;
}

.content {
  width: 100%;
  max-width: 840px;
  text-align: center;
  animation: appear 1s ease both;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

h1 {
  margin: 0;
  font-size: clamp(75px, 11vw, 125px);
  font-weight: 400;
  letter-spacing: -.085em;
  line-height: 1;
}

h1 span {
  color: var(--red);
}

.quote {
  max-width: 720px;
  margin: 35px auto 0;
  color: #d4ccc6;
  font-size: clamp(12px, 1.5vw, 15px);
  font-style: normal;
  letter-spacing: .1em;
  line-height: 2;
}

.author {
  display: block;
  margin-top: 17px;
  color: #b9aca6;
  font-size: 10px;
  letter-spacing: 4px;
}

/* SYSTEM ARCHIVE */

.archive {
  width: 100%;
  max-width: 690px;
  margin: 56px auto 0;
  padding: 22px;
  background: #0a0c0de8;
  border: 1px solid var(--line);
  text-align: left;
  box-shadow: 0 25px 70px #0005;
}

.archive-header,
.archive-path,
.archive-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.archive-header {
  padding-bottom: 17px;
  border-bottom: 1px solid var(--line);
}

.archive-brand {
  display: flex;
  align-items: center;
  gap: 11px;
  color: #d5cbc5;
  font-size: 10px;
  letter-spacing: 2px;
}

.dot {
  width: 7px;
  height: 7px;
  background: var(--red);
  border-radius: 50%;
}

.archive-code,
.archive-path,
.archive-footer {
  color: #938a86;
  font-size: 9px;
  letter-spacing: 1.5px;
}

.archive-path {
  padding: 22px 0;
}

.access {
  color: #b27b82;
}

.archive-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 13px;
}

.file {
  position: relative;
  min-height: 190px;
  padding: 21px;
  background: var(--card);
  border: 1px solid #51474a;
  color: var(--text);
  text-align: left;
  display: flex;
  flex-direction: column;
  transition: .3s ease;
}

.file:hover,
.file:focus-visible {
  background: #251c20;
  border-color: #a16a73;
  transform: translateY(-4px);
  outline: none;
}

.file-top,
.file-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.file-id {
  color: #b78088;
  font-size: 9px;
  letter-spacing: 2px;
}

.file-icon {
  width: 29px;
  height: 29px;
  fill: none;
  stroke: #c7bbb5;
  stroke-width: 1.35;
}

.file-middle {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 18px 0;
}

.file-name {
  font-size: 23px;
  font-weight: 400;
  letter-spacing: 3px;
}

.file-sub {
  margin-top: 9px;
  color: #a99e99;
  font-size: 9px;
  letter-spacing: 2px;
}

.file-bottom {
  color: #958b87;
  font-size: 9px;
  letter-spacing: 1.5px;
}

.file-arrow {
  width: 19px;
  height: 19px;
  fill: none;
  stroke: #d3c6c0;
  stroke-width: 1.4;
  transition: transform .3s;
}

.file:hover .file-arrow {
  transform: translate(3px, -3px);
}

.archive-footer {
  margin-top: 20px;
}

.cursor {
  display: inline-block;
  width: 6px;
  height: 11px;
  margin-left: 5px;
  background: var(--red);
  animation: blink 1.1s steps(1) infinite;
}

@keyframes blink {
  50% { opacity: 0; }
}

/* POPUP */

.overlay {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: #020304c9;
  backdrop-filter: blur(7px);
}

.overlay.open {
  display: flex;
}

.terminal {
  width: 100%;
  max-width: 470px;
  background: #101214;
  border: 1px solid #79565e;
  box-shadow: 0 30px 100px #000c;
}

.terminal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 17px 21px;
  background: #25191d;
  border-bottom: 1px solid #79565e;
}

.terminal-title {
  color: #e6dcd6;
  font-size: 10px;
  letter-spacing: 2px;
}

.close {
  border: 0;
  background: none;
  color: #e6dcd6;
  font-size: 24px;
  line-height: 1;
}

.terminal-body {
  padding: 26px;
}

.terminal-status {
  margin: 0 0 25px;
  color: #b07c83;
  font-size: 10px;
  letter-spacing: 2px;
  line-height: 2;
}

.terminal-link {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 4px;
  border: 0;
  border-bottom: 1px solid #393236;
  background: transparent;
  color: #e5dcd7;
  text-align: left;
  font-size: 12px;
  letter-spacing: 3px;
  opacity: 0;
  transform: translateY(7px);
  animation: revealLink .4s ease forwards;
}

.terminal-link:nth-of-type(2) {
  animation-delay: .15s;
}

@keyframes revealLink {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.terminal-link:hover {
  color: #d28b95;
}

.terminal-link svg {
  width: 19px;
  height: 19px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.4;
}

.terminal-foot {
  margin-top: 25px;
  color: #7e8984;
  font-size: 9px;
  letter-spacing: 2px;
}

/* FOOTER */

footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 25px 6%;
  color: #a99e98;
  font-size: 10px;
  letter-spacing: 2px;
}

.sound {
  border: 0;
  background: none;
  color: inherit;
  font-size: 10px;
  letter-spacing: 2px;
  padding: 8px;
}

.sound:hover {
  color: white;
}

@media(max-width: 600px) {
  header { padding: 25px 7%; }
  main { padding: 35px 16px 60px; }
  .quote { letter-spacing: .04em; }
  .author { letter-spacing: 2px; }
  .archive { padding: 15px; margin-top: 40px; }
  .archive-brand { font-size: 8px; }
  .archive-code { font-size: 8px; }
  .archive-path { font-size: 8px; }
  .archive-grid { gap: 9px; }
  .file { min-height: 170px; padding: 13px; }
  .file-name { font-size: 18px; }
  .file-sub { font-size: 8px; letter-spacing: 1px; }
  .file-id { font-size: 8px; }
  .file-icon { width: 24px; height: 24px; }
  footer { padding: 20px 7%; font-size: 9px; }
}

@media(prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<div class="page">

  <header>
    <div class="connected">CONNECTED</div>
  </header>

  <main>
    <section class="content">

      <h1>zmey<span>.</span></h1>

      <p class="quote">
        “The greatest secret to breaking the rules is to
        appear as though you are following them.”
        <span class="author">
          JOHAN LIEBERT / “MONSTER”
        </span>
      </p>

      <div class="archive">

        <div class="archive-header">
          <div class="archive-brand">
            <span class="dot"></span>
            ZMEY — SYSTEM ARCHIVE
          </div>
          <span class="archive-code">SYS.001</span>
        </div>

        <div class="archive-path">
          <span>C:\ZMEY\ARCHIVE</span>
          <span class="access">ACCESS GRANTED</span>
        </div>

        <div class="archive-grid">

          <button class="file" onclick="openTerminal('games')">
            <div class="file-top">
              <span class="file-id">FILE_001</span>
              <svg class="file-icon" viewBox="0 0 32 32">
                <path d="M9 12h14c3 0 5 3 6 9 1 4-2 6-5 3l-4-4h-8l-4 4c-3 3-6 1-5-3 1-6 3-9 6-9z"/>
                <path d="M10 15v7M6.5 18.5h7"/>
                <circle cx="22" cy="16" r="1"/>
                <circle cx="25" cy="19" r="1"/>
              </svg>
            </div>

            <div class="file-middle">
              <span class="file-name">GAMES</span>
              <span class="file-sub">STEAM / KICK</span>
            </div>

            <div class="file-bottom">
              <span>DIR / OPEN</span>
              <svg class="file-arrow" viewBox="0 0 24 24">
                <path d="M5 19 19 5M8 5h11v11"/>
              </svg>
            </div>
          </button>

          <button class="file" onclick="openTerminal('videos')">
            <div class="file-top">
              <span class="file-id">FILE_002</span>
              <svg class="file-icon" viewBox="0 0 32 32">
                <rect x="4" y="9" width="24" height="16" rx="2"/>
                <path d="M4 14h24M10 9l4 5M19 9l4 5"/>
                <path d="m14 17 6 3-6 3z"/>
              </svg>
            </div>

            <div class="file-middle">
              <span class="file-name">VIDEOS</span>
              <span class="file-sub">YOUTUBE / INSTAGRAM</span>
            </div>

            <div class="file-bottom">
              <span>DIR / OPEN</span>
              <svg class="file-arrow" viewBox="0 0 24 24">
                <path d="M5 19 19 5M8 5h11v11"/>
              </svg>
            </div>
          </button>

        </div>

        <div class="archive-footer">
          <span>SYSTEM READY <span class="cursor"></span></span>
          <span>02 FILES FOUND</span>
        </div>

      </div>

    </section>
  </main>

  <footer>
    <span>NO SIGNAL / 00:00</span>
    <button class="sound" id="soundButton" onclick="toggleSound()">
      ◌ SOUND OFF
    </button>
  </footer>

</div>

<div class="overlay" id="overlay" onclick="closeTerminal(event)">
  <div class="terminal" role="dialog" aria-modal="true"
       aria-label="Archive terminal">

    <div class="terminal-header">
      <span class="terminal-title" id="terminalTitle">FILE_001 / GAMES</span>
      <button class="close" onclick="closeTerminal()" aria-label="Kapat">×</button>
    </div>

    <div class="terminal-body">
      <p class="terminal-status" id="terminalStatus"></p>
      <div id="terminalLinks"></div>
      <div class="terminal-foot">
        END OF DIRECTORY <span class="cursor"></span>
      </div>
    </div>

  </div>
</div>

<script>
const directories = {
  games: {
    title: "FILE_001 / GAMES",
    path: "C:\\ZMEY\\ARCHIVE\\GAMES",
    links: ["STEAM", "KICK"]
  },
  videos: {
    title: "FILE_002 / VIDEOS",
    path: "C:\\ZMEY\\ARCHIVE\\VIDEOS",
    links: ["YOUTUBE", "INSTAGRAM"]
  }
};

const arrowSVG = `
<svg viewBox="0 0 24 24" aria-hidden="true">
  <path d="M5 19 19 5M8 5h11v11"/>
</svg>`;

function openTerminal(type) {
  const data = directories[type];

  document.getElementById("terminalTitle").textContent =
    data.title;

  document.getElementById("terminalStatus").textContent =
    "> " + data.path + "\n> DIRECTORY OPENED";

  document.getElementById("terminalStatus").style.whiteSpace =
    "pre-line";

  document.getElementById("terminalLinks").innerHTML =
    data.links.map(name => `
      <button class="terminal-link"
        onclick="comingSoon('${name}')">
        <span>${name}</span>
        ${arrowSVG}
      </button>
    `).join("");

  document.getElementById("overlay").classList.add("open");
  document.querySelector(".close").focus();
}

function closeTerminal(event) {
  if (event && event.target !== event.currentTarget) {
    return;
  }

  document.getElementById("overlay").classList.remove("open");
}

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closeTerminal();
  }
});

function comingSoon(name) {
  alert(name + " bağlantısı yakında eklenecek.");
}

/* SES */
let audioContext = null;
let oscillators = [];
let soundOn = false;

function toggleSound() {
  const button = document.getElementById("soundButton");

  if (soundOn) {
    oscillators.forEach(osc => {
      try { osc.stop(); } catch(e) {}
    });
    oscillators = [];
    soundOn = false;
    button.textContent = "◌ SOUND OFF";
    return;
  }

  try {
    const AudioCtx =
      window.AudioContext || window.webkitAudioContext;

    if (!AudioCtx) return;

    if (!audioContext) audioContext = new AudioCtx();
    audioContext.resume();

    const master = audioContext.createGain();
    master.gain.value = .025;
    master.connect(audioContext.destination);

    [55, 82.41, 110].forEach((freq, i) => {
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();

      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.value = i === 0 ? .35 : .12;

      osc.connect(gain);
      gain.connect(master);
      osc.start();
      oscillators.push(osc);
    });

    soundOn = true;
    button.textContent = "◉ SOUND ON";
  } catch (e) {
    console.error(e);
  }
}
</script>

</body>
</html>
