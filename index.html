
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zmey.</title>

<style>
:root {
  --bg: #0b0e10;
  --text: #e9e4df;
  --muted: #a9a3a0;
  --line: #48515a;
  --red: #963b45;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  background:
    radial-gradient(
      ellipse at 50% 40%,
      #242b30 0%,
      #14191c 42%,
      #080b0d 100%
    );
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}

button {
  font: inherit;
  cursor: pointer;
}

.page {
  min-height: 100svh;
  display: flex;
  flex-direction: column;
}

main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 70px 20px;
}

.content {
  width: 100%;
  max-width: 850px;
  text-align: center;
  animation: appear 1s ease both;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

h1 {
  margin: 0;
  font-size: clamp(75px, 11vw, 125px);
  font-weight: 400;
  letter-spacing: -.085em;
  line-height: 1;
}

h1 span { color: var(--red); }

.quote {
  max-width: 720px;
  margin: 35px auto 0;
  color: #d4ccc6;
  font-size: clamp(12px, 1.5vw, 15px);
  font-style: normal;
  letter-spacing: .1em;
  line-height: 2;
}

.author {
  display: block;
  margin-top: 17px;
  color: #b9aca6;
  font-size: 10px;
  letter-spacing: 4px;
}

/* INDUSTRIAL ARCHIVE */

.archive {
  width: 100%;
  max-width: 690px;
  margin: 56px auto 0;
  padding: 22px;
  background: #0a0d10e8;
  border: 1px solid #4d5b65;
  text-align: left;
  box-shadow: 0 25px 70px #0007;
}

.archive-header,
.archive-path,
.archive-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.archive-header {
  padding-bottom: 17px;
  border-bottom: 1px solid var(--line);
}

.archive-brand {
  color: #cbd6dc;
  font-size: 10px;
  letter-spacing: 2px;
}

.archive-code,
.archive-path,
.archive-footer {
  color: #91a0aa;
  font-size: 9px;
  letter-spacing: 1.5px;
}

.archive-path { padding: 22px 0; }

.access { color: #b5cbd9; }

/* DARK ICE CHROME */

.archive-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 13px;
}

.file {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  min-height: 190px;
  padding: 21px;
  display: flex;
  flex-direction: column;
  text-align: left;
  color: #11202c;

  background:
    linear-gradient(
      135deg,
      #c6d3db 0%,
      #708a9c 19%,
      #a7c0d1 35%,
      #465d72 54%,
      #829fb4 72%,
      #d1dde4 86%,
      #526b7e 100%
    );

  border: 1px solid #b1c8d7;
  box-shadow:
    inset 0 1px 0 #ffffff99,
    inset 0 -1px 0 #263e5077,
    0 12px 30px #0005;

  transition:
    transform .35s ease,
    box-shadow .35s ease,
    filter .35s ease;
}

.file::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    repeating-linear-gradient(
      0deg,
      #ffffff09 0px,
      #ffffff09 1px,
      transparent 1px,
      transparent 4px
    );
}

.file::after {
  content: "";
  position: absolute;
  top: -50%;
  left: -110%;
  width: 60%;
  height: 200%;
  pointer-events: none;
  background: linear-gradient(
    90deg,
    transparent,
    #ffffff13,
    #ffffffa8,
    #ffffff18,
    transparent
  );
  transform: rotate(24deg);
  transition: left .75s ease;
}

.file:hover::after {
  left: 160%;
}

.file:hover,
.file:focus-visible {
  transform: translateY(-5px);
  filter: brightness(1.08);
  box-shadow:
    inset 0 1px 0 #ffffffcc,
    inset 0 -1px 0 #263e5077,
    0 18px 42px #0009,
    0 0 25px #7fa6c033;
  outline: none;
}

.file-top,
.file-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.file-id {
  color: #233d4f;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 2px;
}

.file-icon {
  width: 29px;
  height: 29px;
  fill: none;
  stroke: #172c3b;
  stroke-width: 1.35;
}

.file-middle {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 18px 0;
}

.file-name {
  color: #101e2a;
  font-size: 23px;
  font-weight: 500;
  letter-spacing: 3px;
}

.file-sub {
  margin-top: 9px;
  color: #263c4d;
  font-size: 9px;
  letter-spacing: 2px;
}

.file-bottom {
  color: #263c4d;
  font-size: 9px;
  letter-spacing: 1.5px;
}

.file-arrow {
  width: 19px;
  height: 19px;
  fill: none;
  stroke: #172c3b;
  stroke-width: 1.5;
  transition: transform .3s;
}

.file:hover .file-arrow {
  transform: translate(3px, -3px);
}

.archive-footer { margin-top: 20px; }

.cursor {
  display: inline-block;
  width: 6px;
  height: 11px;
  margin-left: 5px;
  background: #9dbbcc;
  animation: blink 1.1s steps(1) infinite;
}

@keyframes blink {
  50% { opacity: 0; }
}

/* TERMINAL POPUP */

.overlay {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: #020304c9;
  backdrop-filter: blur(7px);
}

.overlay.open { display: flex; }

.terminal {
  width: 100%;
  max-width: 470px;
  background: #101519;
  border: 1px solid #809eaf;
  box-shadow: 0 30px 100px #000c;
}

.terminal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 17px 21px;
  background: linear-gradient(90deg, #263a48, #15232d);
  border-bottom: 1px solid #809eaf;
}

.terminal-title {
  color: #e0eaf0;
  font-size: 10px;
  letter-spacing: 2px;
}

.close {
  border: 0;
  background: none;
  color: #e0eaf0;
  font-size: 24px;
  line-height: 1;
}

.terminal-body { padding: 26px; }

.terminal-status {
  margin: 0 0 25px;
  color: #9fb9c9;
  font-size: 10px;
  letter-spacing: 2px;
  line-height: 2;
  white-space: pre-line;
}

.terminal-link {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 4px;
  border: 0;
  border-bottom: 1px solid #394852;
  background: transparent;
  color: #e0eaf0;
  text-align: left;
  font-size: 12px;
  letter-spacing: 3px;
  opacity: 0;
  transform: translateY(7px);
  animation: revealLink .4s ease forwards;
}

.terminal-link:nth-child(2) {
  animation-delay: .15s;
}

@keyframes revealLink {
  to { opacity: 1; transform: translateY(0); }
}

.terminal-link:hover { color: #a9d7f0; }

.terminal-link svg {
  width: 19px;
  height: 19px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.4;
}

.terminal-foot {
  margin-top: 25px;
  color: #8095a1;
  font-size: 9px;
  letter-spacing: 2px;
}

/* FOOTER */

footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 25px 6%;
  color: #a9b7bf;
  font-size: 10px;
  letter-spacing: 2px;
}

.sound {
  border: 0;
  background: none;
  color: inherit;
  font-size: 10px;
  letter-spacing: 2px;
  padding: 8px;
}

.sound:hover { color: white; }

@media(max-width: 600px) {
  main { padding: 45px 16px 60px; }
  .quote { letter-spacing: .04em; }
  .author { letter-spacing: 2px; }
  .archive { padding: 15px; margin-top: 40px; }
  .archive-brand { font-size: 8px; }
  .archive-code { font-size: 8px; }
  .archive-path { font-size: 8px; }
  .archive-grid { gap: 9px; }
  .file { min-height: 170px; padding: 13px; }
  .file-name { font-size: 18px; }
  .file-sub { font-size: 8px; letter-spacing: 1px; }
  .file-id { font-size: 8px; }
  .file-icon { width: 24px; height: 24px; }
  footer { padding: 20px 7%; font-size: 9px; }
}

@media(prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<div class="page">

  <main>
    <section class="content">

      <h1>zmey<span>.</span></h1>

      <p class="quote">
        “The greatest secret to breaking the rules is to
        appear as though you are following them.”
        <span class="author">
          JOHAN LIEBERT / “MONSTER”
        </span>
      </p>

      <div class="archive">

        <div class="archive-header">
          <span class="archive-brand">ZMEY / INDUSTRIAL ARCHIVE</span>
          <span class="archive-code">REV.004</span>
        </div>

        <div class="archive-path">
          <span>C:\ZMEY\ARCHIVE</span>
          <span class="access">ACCESS GRANTED</span>
        </div>

        <div class="archive-grid">

          <button class="file" onclick="openTerminal('games')">
            <div class="file-top">
              <span class="file-id">UNIT_001</span>
              <svg class="file-icon" viewBox="0 0 32 32" aria-hidden="true">
                <path d="M9 12h14c3 0 5 3 6 9 1 4-2 6-5 3l-4-4h-8l-4 4c-3 3-6 1-5-3 1-6 3-9 6-9z"/>
                <path d="M10 15v7M6.5 18.5h7"/>
                <circle cx="22" cy="16" r="1"/>
                <circle cx="25" cy="19" r="1"/>
              </svg>
            </div>
            <div class="file-middle">
              <span class="file-name">GAMES</span>
              <span class="file-sub">STEAM / KICK</span>
            </div>
            <div class="file-bottom">
              <span>ACCESS</span>
              <svg class="file-arrow" viewBox="0 0 24 24">
                <path d="M5 19 19 5M8 5h11v11"/>
              </svg>
            </div>
          </button>

          <button class="file" onclick="openTerminal('videos')">
            <div class="file-top">
              <span class="file-id">UNIT_002</span>
              <svg class="file-icon" viewBox="0 0 32 32" aria-hidden="true">
                <rect x="4" y="9" width="24" height="16" rx="2"/>
                <path d="M4 14h24M10 9l4 5M19 9l4 5"/>
                <path d="m14 17 6 3-6 3z"/>
              </svg>
            </div>
            <div class="file-middle">
              <span class="file-name">VIDEOS</span>
              <span class="file-sub">YOUTUBE / INSTAGRAM</span>
            </div>
            <div class="file-bottom">
              <span>ACCESS</span>
              <svg class="file-arrow" viewBox="0 0 24 24">
                <path d="M5 19 19 5M8 5h11v11"/>
              </svg>
            </div>
          </button>

        </div>

        <div class="archive-footer">
          <span>SYSTEM READY <span class="cursor"></span></span>
          <span>02 UNITS</span>
        </div>

      </div>

    </section>
  </main>

  <footer>
    <span>NO SIGNAL / 00:00</span>
    <button class="sound" id="soundButton" onclick="toggleSound()">
      ◌ SOUND OFF
    </button>
  </footer>

</div>

<div class="overlay" id="overlay" onclick="closeTerminal(event)">
  <div class="terminal" role="dialog" aria-modal="true"
       aria-label="Archive terminal">

    <div class="terminal-header">
      <span class="terminal-title" id="terminalTitle"></span>
      <button class="close" onclick="closeTerminal()" aria-label="Kapat">×</button>
    </div>

    <div class="terminal-body">
      <p class="terminal-status" id="terminalStatus"></p>
      <div id="terminalLinks"></div>
      <div class="terminal-foot">
        END OF DIRECTORY <span class="cursor"></span>
      </div>
    </div>

  </div>
</div>

<script>
const directories = {
  games: {
    title: "UNIT_001 / GAMES",
    path: "C:\\ZMEY\\ARCHIVE\\GAMES",
    links: ["STEAM", "KICK"]
  },
  videos: {
    title: "UNIT_002 / VIDEOS",
    path: "C:\\ZMEY\\ARCHIVE\\VIDEOS",
    links: ["YOUTUBE", "INSTAGRAM"]
  }
};

const arrowSVG = `
<svg viewBox="0 0 24 24" aria-hidden="true">
  <path d="M5 19 19 5M8 5h11v11"/>
</svg>`;

function openTerminal(type) {
  const data = directories[type];

  document.getElementById("terminalTitle").textContent =
    data.title;

  document.getElementById("terminalStatus").textContent =
    "> " + data.path + "\n> DIRECTORY OPENED";

  document.getElementById("terminalLinks").innerHTML =
    data.links.map(name => `
      <button class="terminal-link"
        onclick="comingSoon('${name}')">
        <span>${name}</span>
        ${arrowSVG}
      </button>
    `).join("");

  document.getElementById("overlay").classList.add("open");
  document.querySelector(".close").focus();
}

function closeTerminal(event) {
  if (event && event.target !== event.currentTarget) return;
  document.getElementById("overlay").classList.remove("open");
}

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeTerminal();
});

function comingSoon(name) {
  alert(name + " bağlantısı yakında eklenecek.");
}

/* AMBIENT SOUND */
let audioContext = null;
let oscillators = [];
let soundOn = false;

function toggleSound() {
  const button = document.getElementById("soundButton");

  if (soundOn) {
    oscillators.forEach(osc => {
      try { osc.stop(); } catch(e) {}
    });
    oscillators = [];
    soundOn = false;
    button.textContent = "◌ SOUND OFF";
    return;
  }

  try {
    const AudioCtx =
      window.AudioContext || window.webkitAudioContext;

    if (!AudioCtx) return;

    if (!audioContext) audioContext = new AudioCtx();
    audioContext.resume();

    const master = audioContext.createGain();
    master.gain.value = .025;
    master.connect(audioContext.destination);

    [55, 82.41, 110].forEach((freq, i) => {
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();

      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.value = i === 0 ? .35 : .12;

      osc.connect(gain);
      gain.connect(master);
      osc.start();
      oscillators.push(osc);
    });

    soundOn = true;
    button.textContent = "◉ SOUND ON";
  } catch (e) {
    console.error(e);
  }
}
</script>

</body>
</html>
