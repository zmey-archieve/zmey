
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080a0b">
<title>zmey.</title>
<style>
:root {
  --white: #ded9d3;
  --muted: #938d8b;
  --red: #752b34;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: #080a0b;
  color: var(--white);
  font-family: Georgia, "Times New Roman", serif;
  overflow-x: hidden;
}
button { font: inherit; cursor: pointer; }

/* TAMAMEN KODLA ÇİZİLEN ORMAN */
.forest {
  position: fixed;
  inset: 0;
  overflow: hidden;
  z-index: -1;
  background:
    radial-gradient(ellipse at 50% 65%, #252c2c 0%, #101617 45%, #050607 100%);
}
.tree {
  position: absolute;
  bottom: -10%;
  width: var(--w);
  height: var(--h);
  left: var(--x);
  opacity: var(--opacity);
  transform-origin: bottom center;
}
.trunk {
  position: absolute;
  bottom: 0;
  left: 45%;
  width: 12%;
  height: 100%;
  background: linear-gradient(90deg, #030506, #13191a, #030506);
  transform: rotate(var(--lean));
}
.branch {
  position: absolute;
  width: 5%;
  height: 55%;
  bottom: 38%;
  left: 50%;
  background: #06090a;
  transform-origin: bottom center;
}
.branch.left { transform: rotate(-37deg); }
.branch.right { transform: rotate(39deg); }
.branch.small-left {
  height: 34%;
  bottom: 57%;
  transform: rotate(-62deg);
}
.branch.small-right {
  height: 31%;
  bottom: 62%;
  transform: rotate(65deg);
}
.fog {
  position: absolute;
  width: 120%;
  height: 45%;
  left: -10%;
  bottom: 5%;
  background: radial-gradient(
    ellipse,
    #9ba4a416 0%,
    #7b89890b 45%,
    transparent 72%
  );
  filter: blur(38px);
  animation: drift 28s ease-in-out infinite alternate;
}
.fog.two {
  bottom: 27%;
  opacity: .55;
  animation-duration: 41s;
  animation-direction: alternate-reverse;
}
@keyframes drift {
  from { transform: translateX(-12%); }
  to { transform: translateX(12%); }
}
.vignette {
  position: absolute;
  inset: 0;
  background: radial-gradient(
    ellipse at center,
    transparent 15%,
    #000000b8 100%
  );
}
.grain {
  position: absolute;
  inset: 0;
  opacity: .12;
  pointer-events: none;
  background-image: repeating-linear-gradient(
    0deg,
    transparent 0px,
    #ffffff0c 1px,
    transparent 2px,
    transparent 5px
  );
}

/* SAYFA */
.page {
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  position: relative;
}
.top {
  display: flex;
  justify-content: flex-end;
  padding: 35px 6%;
}
.connected {
  font: 10px Arial, sans-serif;
  letter-spacing: 4px;
  color: #aaa1a0;
}
.dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--red);
  margin-right: 14px;
  box-shadow: 0 0 10px #752b3470;
  animation: pulse 3s infinite;
}
@keyframes pulse {
  50% { opacity: .3; }
}
main {
  flex: 1;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 55px 20px 100px;
}
.content {
  width: 100%;
  max-width: 850px;
  text-align: center;
  animation: appear 2.2s ease both;
}
@keyframes appear {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}
h1 {
  margin: 0;
  font-size: clamp(72px, 10vw, 132px);
  font-weight: normal;
  letter-spacing: -.075em;
  line-height: 1.1;
}
h1 span { color: #842d38; }
.quote {
  margin: 27px auto 0;
  color: #c2bab7;
  font-size: clamp(13px, 1.6vw, 17px);
  font-style: italic;
  letter-spacing: .065em;
  line-height: 1.9;
}
.author {
  display: block;
  margin-top: 13px;
  font: 10px Arial, sans-serif;
  font-style: normal;
  letter-spacing: 5px;
  color: #918786;
}
.rule {
  width: min(480px, 75%);
  height: 1px;
  margin: 58px auto 45px;
  background: linear-gradient(
    90deg,
    transparent,
    #71303a,
    transparent
  );
}
.folders {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 24px;
  max-width: 670px;
  margin: auto;
}
.folder {
  background: #090b0bb5;
  border: 1px solid #62545490;
  color: var(--white);
  padding: 23px 27px;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 22px;
  transition: background .3s, border-color .3s, transform .3s;
}
.folder:hover {
  background: #23181bdc;
  border-color: #a46d75;
  transform: translateY(-3px);
}
.folder svg {
  width: 35px;
  height: 35px;
  fill: none;
  stroke: #baa9a5;
  stroke-width: 1.4;
  flex-shrink: 0;
}
.folder-name {
  display: block;
  font-size: 24px;
  letter-spacing: 3px;
}
.folder-sub {
  display: block;
  margin-top: 7px;
  font: 10px Arial, sans-serif;
  color: #a09896;
  letter-spacing: 2px;
}
footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 28px 6%;
  color: #a29a97;
  font: 10px Arial, sans-serif;
  letter-spacing: 4px;
}
.sound {
  color: inherit;
  background: transparent;
  border: 0;
  font-size: 10px;
  letter-spacing: 3px;
}
.sound:hover { color: #eee; }

/* AÇILAN PENCERELER */
.window {
  display: none;
  position: fixed;
  top: 32%;
  left: 50%;
  transform: translateX(-50%);
  width: 400px;
  max-width: 90vw;
  background: #0d0d0fee;
  border: 1px solid #684c52;
  box-shadow: 0 20px 90px #000;
  z-index: 20;
}
.window.open { display: block; }
.window-head {
  padding: 14px 18px;
  background: #25171b;
  border-bottom: 1px solid #684c52;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font: 12px Arial, sans-serif;
  letter-spacing: 3px;
}
.window-head button {
  color: #eee;
  background: none;
  border: 0;
  font-size: 22px;
}
.window-links { padding: 16px 25px; }
.window-links button {
  display: flex;
  justify-content: space-between;
  width: 100%;
  padding: 19px 5px;
  border: 0;
  border-bottom: 1px solid #373035;
  background: none;
  color: #e8dfdb;
  letter-spacing: 3px;
  text-align: left;
}
.window-links button:last-child { border: 0; }
.window-links button:hover { color: #b97b86; }

@media(max-width: 650px) {
  .top { padding: 25px 7%; }
  main { padding: 35px 20px 80px; }
  .folders { grid-template-columns: 1fr; gap: 13px; }
  .folder { padding: 18px 22px; }
  .folder-name { font-size: 21px; }
  .rule { margin: 40px auto 30px; }
  footer { padding: 24px 7%; letter-spacing: 2px; }
}
@media(prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>
<body>

<div class="forest" aria-hidden="true" id="forest">
  <div class="fog"></div>
  <div class="fog two"></div>
  <div class="vignette"></div>
  <div class="grain"></div>
</div>

<div class="page">
  <header class="top">
    <div class="connected">
      <span class="dot"></span>CONNECTED
    </div>
  </header>

  <main>
    <div class="content">
      <h1>zmey<span>.</span></h1>

      <p class="quote">
        “Hatred is born when people gather together.”
        <span class="author">— JOHAN LIEBERT</span>
      </p>

      <div class="rule"></div>

      <nav class="folders" aria-label="Bağlantılar">
        <button class="folder" onclick="openWindow('games')">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path d="M4 13h16l6 6h18v23H4z"/>
            <path d="M4 19h40"/>
          </svg>
          <span>
            <span class="folder-name">games/</span>
            <span class="folder-sub">steam · kick</span>
          </span>
        </button>

        <button class="folder" onclick="openWindow('videos')">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path d="M4 13h16l6 6h18v23H4z"/>
            <path d="M4 19h40"/>
          </svg>
          <span>
            <span class="folder-name">videos/</span>
            <span class="folder-sub">youtube · instagram</span>
          </span>
        </button>
      </nav>
    </div>
  </main>

  <footer>
    <span>NO SIGNAL / 00:00</span>
    <button class="sound" id="soundButton"
      onclick="toggleSound()">◌ SOUND OFF</button>
  </footer>
</div>

<div class="window" id="games">
  <div class="window-head">
    <span>GAMES</span>
    <button onclick="closeWindow('games')">×</button>
  </div>
  <div class="window-links">
    <button onclick="comingSoon('Steam')">STEAM ↗</button>
    <button onclick="comingSoon('Kick')">KICK ↗</button>
  </div>
</div>

<div class="window" id="videos">
  <div class="window-head">
    <span>VIDEOS</span>
    <button onclick="closeWindow('videos')">×</button>
  </div>
  <div class="window-links">
    <button onclick="comingSoon('YouTube')">YOUTUBE ↗</button>
    <button onclick="comingSoon('Instagram')">INSTAGRAM ↗</button>
  </div>
</div>

<script>
/* RASTGELE ORMAN AĞAÇLARI */
const forest = document.getElementById("forest");

function random(seed) {
  const x = Math.sin(seed * 127.1) * 43758.5453;
  return x - Math.floor(x);
}

for (let i = 0; i < 33; i++) {
  const tree = document.createElement("div");
  tree.className = "tree";

  const depth = random(i + 5);
  const height = 55 + depth * 80;
  const width = 35 + depth * 65;

  tree.style.setProperty("--x", (random(i + 90) * 115 - 7) + "%");
  tree.style.setProperty("--h", height + "vh");
  tree.style.setProperty("--w", width + "px");
  tree.style.setProperty("--opacity", .25 + depth * .65);
  tree.style.setProperty("--lean", (random(i + 300) * 12 - 6) + "deg");

  tree.innerHTML = `
    <div class="trunk"></div>
    <div class="branch left"></div>
    <div class="branch right"></div>
    <div class="branch small-left"></div>
    <div class="branch small-right"></div>
  `;

  forest.insertBefore(tree, forest.firstChild);
}

/* KLASÖRLER */
function openWindow(id) {
  document.querySelectorAll(".window").forEach(w => {
    w.classList.remove("open");
  });
  document.getElementById(id).classList.add("open");
}

function closeWindow(id) {
  document.getElementById(id).classList.remove("open");
}

function comingSoon(name) {
  alert(name + " bağlantısı yakında eklenecek.");
}

/* SES: ŞİMDİLİK KONTROL HAZIR */
let soundOn = false;

function toggleSound() {
  soundOn = !soundOn;
  document.getElementById("soundButton").textContent =
    soundOn ? "◉ SOUND ON" : "◌ SOUND OFF";
}
</script>
</body>
</html>
